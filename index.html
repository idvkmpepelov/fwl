<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League mat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.45 Georgia, "Iowan Old Style", serif;
    background: #163028; color: #f3ecdf;
  }
  header, main { max-width: 880px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.45rem; margin: 0 0 4px; letter-spacing: 0.02em; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  p.note { margin: 0; color: #c9d4c4; font-size: 0.92rem; }
  .panel {
    background: #214237; border: 1px solid #3d6a56; border-radius: 10px;
    padding: 12px; margin-top: 12px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: #d5e0cf; }
  select, button {
    font: inherit; color: #f3ecdf; background: #13261f; border: 1px solid #5d8a72;
    border-radius: 8px; padding: 8px 10px;
  }
  button { cursor: pointer; background: #2f6b4f; }
  button:hover { background: #3c8462; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost { background: transparent; }
  .board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .side { padding: 8px; border-radius: 8px; background: #13261f; min-width: 0; }
  .side.on-top { outline: 2px solid #e2c56a; }
  .code { font-weight: 700; font-size: 1.25rem; }
  .meta { color: #c9d4c4; font-size: 0.82rem; }
  .score { font-variant-numeric: tabular-nums; font-size: 1.8rem; text-align: center; }
  .bar { height: 8px; background: #0d1b16; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: #d7a441; }
  .clock { text-align: center; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .actions button { flex: 1 1 140px; text-align: left; }
  .log { list-style: none; margin: 8px 0 0; padding: 0; max-height: 280px; overflow: auto; }
  .log li { padding: 4px 0; border-bottom: 1px solid #315546; font-size: 0.92rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { text-align: right; padding: 3px 4px; border-bottom: 1px solid #315546; }
  th:first-child, td:first-child { text-align: left; }
  .hide { display: none; }
</style>
</head>
<body>
<header>
  <h1>League mat</h1>
  <p class="note">Fictional two-period match. Pick two codes, then call the action. A ten-point lead can be taken or wrestled through. A pin is three continuous seconds.</p>
</header>
<main>
  <section class="panel" id="setup">
    <div class="row">
      <label>Red side
        <select id="selA"></select>
      </label>
      <label>Blue side
        <select id="selB"></select>
      </label>
      <label>You call
        <select id="selYou">
          <option value="A">Red</option>
          <option value="B">Blue</option>
          <option value="none">Watch both</option>
        </select>
      </label>
      <label>Start rule
        <select id="selRank">
          <option value="on">Lower ability starts on top</option>
          <option value="off">Coin flip for top</option>
        </select>
      </label>
      <button type="button" id="btnStart">Start match</button>
      <button type="button" class="ghost" id="btnRoster">Roster</button>
    </div>
    <div id="roster" class="hide"></div>
  </section>

  <section class="panel hide" id="match">
    <div class="board">
      <div class="side" id="cardA"></div>
      <div class="clock" id="clock"></div>
      <div class="side" id="cardB"></div>
    </div>
    <p id="status" class="note"></p>
    <div class="actions" id="actions"></div>
    <ul class="log" id="log"></ul>
  </section>
</main>
<script src="engine/engine.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const { ROSTER } = FWL;

function render() {
  const G = FWL.G;
  $("match").classList.remove("hide");
  ["A", "B"].forEach((id) => {
    const s = FWL.sideBy(id);
    const card = $(id === "A" ? "cardA" : "cardB");
    card.className = "side" + (G.pos === id ? " on-top" : "");
    card.innerHTML =
      '<div class="code">' + s.w.id + '</div>' +
      '<div class="meta">' + s.w.kg + " kg · age " + s.w.age + " · fatigue " + s.f.toFixed(0) + "%</div>" +
      '<div class="bar"><span style="width:' + s.f.toFixed(0) + '%"></span></div>';
  });
  $("clock").innerHTML = '<div class="score">' + G.A.score + " – " + G.B.score + "</div>" +
    "<div>" + (G.period === 3 ? "OT " : "P" + G.period + " ") + FWL.clock(G.clock) + "</div>" +
    '<div class="meta">' + (G.pos === "N" ? "Standing" : FWL.sideBy(G.pos).w.id + " on top") + "</div>";
  const box = $("actions");
  box.innerHTML = "";
  const status = $("status");
  if (G.over) {
    status.textContent = G.winner
      ? FWL.sideBy(G.winner).w.id + " wins by " + G.reason + ". League points " + G.table.wp + "–" + G.table.lp + "."
      : "Draw. No league points.";
    const again = document.createElement("button");
    again.type = "button";
    again.textContent = "New match";
    again.onclick = () => { $("match").classList.add("hide"); };
    box.appendChild(again);
  } else if (G.pendingSup) {
    const leader = G.A.score > G.B.score ? G.A.w.id : G.B.w.id;
    status.textContent = leader + " leads by 10 or more. Take technical superiority, or keep wrestling?";
    [["Take the win", true], ["Continue", false]].forEach(([label, take]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.onclick = () => { FWL.acceptSup(take); render(); };
      box.appendChild(b);
    });
  } else {
    const actor = FWL.youId();
    const posText = G.pos === "N" ? "Neutral." : FWL.sideBy(G.pos).w.id + " is on top.";
    if (!actor) {
      status.textContent = posText + " Both sides are called by the engine.";
      addBtn(box, "Next exchange", () => {
        const id = G.pos === "N" ? (Math.random() < 0.5 ? "A" : "B") : (Math.random() < 0.55 ? G.pos : FWL.other(G.pos));
        const k = Math.random() < 0.15 ? "ride" : FWL.aiChoice(id);
        if (k === "ride") FWL.ride(id); else FWL.resolve(id, k);
        render();
      });
      addBtn(box, "Sim to the whistle", simRest);
    } else {
      const who = FWL.sideBy(actor).w.id;
      status.textContent = posText + " Call " + who + ".";
      FWL.legalFor(actor).forEach((k) => {
        if (k === "ride") { addBtn(box, "Ride / circle (0)", () => { FWL.ride(actor); render(); }); return; }
        const tech = FWL.TECH[k];
        const info = FWL.rating(FWL.sideBy(actor), FWL.sideBy(FWL.other(actor)), tech);
        addBtn(box, tech.name + " (" + Math.round(info.p * 100) + "%)", () => { FWL.resolve(actor, k); render(); });
      });
      addBtn(box, "Let the other side move", () => {
        const id = FWL.other(actor);
        FWL.resolve(id, FWL.aiChoice(id));
        render();
      });
    }
  }
  $("log").innerHTML = G.lines.map((l) => "<li>" + l + "</li>").join("");
}

function addBtn(box, label, fn) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.onclick = fn;
  box.appendChild(b);
}

function simRest() {
  let guard = 0;
  const G = () => FWL.G;
  while (!G().over && !G().pendingSup && guard < 80) {
    guard++;
    const id = G().pos === "N" ? (Math.random() < 0.5 ? "A" : "B") : (Math.random() < 0.62 ? G().pos : FWL.other(G().pos));
    FWL.resolve(id, FWL.aiChoice(id));
  }
  if (G().pendingSup) FWL.acceptSup(true);
  render();
}

function start() {
  const a = ROSTER.find((w) => w.id === $("selA").value);
  const b = ROSTER.find((w) => w.id === $("selB").value);
  if (a.id === b.id) { alert("Pick two different wrestlers."); return; }
  try {
    FWL.begin(a, b, $("selYou").value, $("selRank").value === "on");
  } catch (e) {
    alert("Pick two different wrestlers.");
    return;
  }
  render();
}

function rosterTable() {
  const box = $("roster");
  const show = box.classList.toggle("hide");
  if (!show) return;
  const heads = ["", "Age", "cm", "kg", "Str", "Grip", "End", "Spd", "Flx", "Tec", "Exp"];
  const rows = ROSTER.map((w) => "<tr><td>" + [w.id, w.age, w.h, w.kg, w.str, w.grp, w.end, w.spd, w.flx, w.tec, w.exp].join("</td><td>") + "</td></tr>");
  box.innerHTML = "<table><tr>" + heads.map((h) => "<th>" + h + "</th>").join("") + "</tr>" + rows.join("") + "</table>";
}

function fillSelects() {
  const opts = ROSTER.map((w) => "<option>" + w.id + "</option>").join("");
  $("selA").innerHTML = opts;
  $("selB").innerHTML = opts;
  $("selB").value = "MTA";
  $("selA").value = "IPE";
}
fillSelects();
$("btnStart").onclick = start;
$("btnRoster").onclick = rosterTable;
</script>
</body>
</html>
